# The SSO endpoint: SPNEGO through mod_auth_gssapi, on 8081.
Listen 8081
<VirtualHost *:8081>
    ServerName nc-servers.lab
    DocumentRoot /var/www/lab
    <Location "/secure">
        AuthType GSSAPI
        AuthName "netcheck lab"
        GssapiCredStore keytab:/etc/apache2/http.keytab
        GssapiLocalName off
        Require valid-user
    </Location>
</VirtualHost>
