[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_kdc = false
    dns_lookup_realm = false
    rdns = false
    forwardable = true

[realms]
    LAB.TEST = {
        kdc = nc-servers.lab:88
        admin_server = nc-servers.lab:749
    }

[domain_realm]
    .lab = LAB.TEST
    nc-servers.lab = LAB.TEST
