# The lab's web servers: one plain, four TLS ports with different certificates.
server {
    listen 80;
    listen [::]:80;
    root /var/www/lab;
    default_type text/plain;
    location = /ok       { return 200 "ok\n"; }
    location = /moved    { return 301 /ok; }
    location = /error    { return 500 "boom\n"; }
    location = /loop     { return 302 /loop; }
    location = /big      { alias /var/www/lab/big.bin; }
    location = /to-denied { return 302 http://10.78.0.20/ok; }
    location = /bundle.yaml { alias /var/www/lab/bundle.yaml; default_type application/yaml; }
    location = /bundle.json { alias /var/www/lab/bundle.json; default_type application/json; }
}

# the lab CA's good certificate
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    ssl_certificate /etc/lab/pki/server.pem;
    ssl_certificate_key /etc/lab/pki/server-key.pem;
    default_type text/plain;
    location = /ok       { return 200 "ok\n"; }
    location = /to-http  { return 301 http://nc-servers.lab/ok; }
    location = /bundle.yaml { alias /var/www/lab/bundle.yaml; default_type application/yaml; }
}
# an expired certificate
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    ssl_certificate /etc/lab/pki/expired.pem;
    ssl_certificate_key /etc/lab/pki/expired-key.pem;
    location / { return 200 "expired\n"; }
}
# a certificate for another name
server {
    listen 8445 ssl;
    listen [::]:8445 ssl;
    ssl_certificate /etc/lab/pki/wrongname.pem;
    ssl_certificate_key /etc/lab/pki/wrongname-key.pem;
    location / { return 200 "wrong name\n"; }
}
# a certificate from a CA nobody trusts
server {
    listen 8446 ssl;
    listen [::]:8446 ssl;
    ssl_certificate /etc/lab/pki/unknownca.pem;
    ssl_certificate_key /etc/lab/pki/unknownca-key.pem;
    location / { return 200 "unknown CA\n"; }
}
